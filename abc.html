<div class="action-icons">

  <!-- ---------- Open (view-only) / Continue (yours) ---------- -->
  <!-- Not yours → Open, always visible, works even when locked to someone else -->
  <button *ngIf="!action(c).isMine"
          class="icon-btn has-tooltip"
          title="Open candidate details"
          (click)="open(c)">
    <i class="icon bi bi-box-arrow-up-right"></i>
  </button>

  <!-- Assigned to "me" → Continue -->
  <button *ngIf="action(c).isMine"
          class="icon-btn has-tooltip"
          title="Continue — you are the assigned interviewer"
          (click)="open(c)">
    <i class="icon bi bi-arrow-right-circle-fill"></i>
  </button>

  <!-- ---------- HR Assign / Re-assign / Un-assign ---------- -->
  <ng-container *ngIf="action(c).canHrAssign">
    <button *ngIf="action(c).assignedToName && !action(c).isMine"
            class="icon-btn has-tooltip"
            title="Re-assign this round to another HR user"
            (click)="startHrAssign(c, action(c).activeRound!)">
      <i class="icon bi bi-people-fill"></i>
    </button>
    <button *ngIf="!action(c).assignedToName"
            class="icon-btn has-tooltip"
            title="Assign an HR interviewer to this round"
            (click)="startHrAssign(c, action(c).activeRound!)">
      <i class="icon bi bi-person-add"></i>
    </button>
    <button *ngIf="action(c).isMine"
            class="icon-btn has-tooltip"
            title="Release the HR assignment (make the round free again)"
            (click)="startUnassign(c)">
      <i class="icon bi bi-person-dash"></i>
    </button>
  </ng-container>

  <!-- ---------- Non-HR Panel Member Assign / Un-assign ---------- -->
  <!-- FIX: was action(c).canHrAssign, should be the inverse -->
  <ng-container *ngIf="!action(c).canHrAssign">
    <button *ngIf="action(c).canSelfAssign"
            class="icon-btn has-tooltip"
            title="Assign yourself to this round"
            (click)="startSelfAssign(c, action(c).activeRound!)">
      <i class="icon bi bi-person-add"></i>
    </button>
    <button *ngIf="action(c).isMine"
            class="icon-btn has-tooltip"
            title="Release your assignment (make the round free again)"
            (click)="startUnassign(c)">
      <i class="icon bi bi-person-dash"></i>
    </button>
  </ng-container>

  <!-- Lock icon removed entirely — Open button now covers this case -->

</div>
