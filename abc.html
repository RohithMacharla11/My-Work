managementSkills(): Observable<string[]> {
  return (this.managementSkills$ ??= this.sp
    .getAll<any>(LISTS.managementSkills, {
      select: ['Title', 'Order'],
      orderby: 'Order asc',
      top: 500,
    })
    .pipe(
      map(items => items.map(i => i.Title).filter(Boolean)),
      shareReplay(1),
    ));
}
